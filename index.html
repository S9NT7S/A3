<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mapa Interativo - Bourbon Country</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
            }

            /* BARRA SUPERIOR COM OS DOIS DROPDOWNS */
            .barra-topo {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 20px;
                position: relative;
                z-index: 5;
            }

            .container-fundo {
                position: relative;
                width: 100%;
                max-width: 2048px;
                margin: 0 auto;
            }

            .container-fundo img {
                width: 100%;
                height: auto;
                display: block;
            }

            /* BOTÃO INVISÍVEL PROPORCIONAL AO MAPA */
            .botao-sobreposto {
                position: absolute;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                background-color: transparent;
            }

            /* Ajuste os valores em % para alinhar exatamente sobre a área desejada */
            .botao-1 {
                top: 27%;
                left: 20%;
                width: 16%;
                height: 9%;
            }

            /* DROPDOWNS */
            .dropdown,
            .dropdown1 {
                position: relative;
                display: inline-block;
            }

            .dropdown-btn,
            .dropdown-btn1 {
                background-color: slateblue;
                color: white;
                padding: 12px 20px;
                font-size: 16px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: 0.2s;
            }

            .dropdown-btn:hover,
            .dropdown-btn1:hover {
                background-color: orange;
            }

            .arrow,
            .arrow1 {
                border: solid white;
                border-width: 0 2px 2px 0;
                display: inline-block;
                padding: 3px;
                transform: rotate(45deg);
                transition: transform 0.2s;
            }

            .dropdown.active .arrow,
            .dropdown1.active .arrow1 {
                transform: rotate(-135deg);
                margin-top: 4px;
            }

            .dropdown-menu,
            .dropdown-menu1 {
                display: none;
                position: absolute;
                top: 100%;
                background-color: white;
                min-width: 180px;
                max-height: 70vh;
                overflow-y: auto;
                box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.15);
                border-radius: 4px;
                margin-top: 4px;
                z-index: 6;
            }

            /* Garante que o menu da direita abra para dentro da tela */
            .dropdown-menu1 {
                right: 0;
            }

            .dropdown-menu a,
            .dropdown-menu1 a {
                color: #333;
                padding: 14px 20px;
                text-decoration: none;
                display: block;
                transition: 0.2s;
            }

            .dropdown-menu a:hover,
            .dropdown-menu1 a:hover {
                background-color: #f1f1f1;
            }

            .dropdown.active .dropdown-menu,
            .dropdown1.active .dropdown-menu1 {
                display: block;
            }

            /* ==================== ESTILOS DA MODAL ==================== */
            .modal-backdrop {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgba(0, 0, 0, 0.6);
                z-index: 10;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }

            .modal-backdrop.mostrar-modal {
                display: flex;
            }

            .modal-container {
                background-color: white;
                border-radius: 8px;
                width: 90%;
                max-width: 1200px;
                max-height: 90vh;
                overflow: hidden;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
                position: relative;
            }

            .modal-fechar {
                position: absolute;
                top: 10px;
                right: 16px;
                font-size: 48px;
                line-height: 1;
                background: rgba(255, 255, 255, 0.8);
                border: none;
                border-radius: 50%;
                width: 52px;
                height: 52px;
                cursor: pointer;
                color: #ff0000;
            }

            .modal-fechar:hover {
                color: #000;
            }

            .imagem-modal {
                width: 100%;
                max-height: 85vh;
                object-fit: contain;
                display: block;
                margin: 0 auto;
            }
        </style>
    </head>
    <body>
        <div class="barra-topo">
            <!-- DROPDOWN DA ESQUERDA -->
            <div class="dropdown" id="meuDropdown1">
                <button class="dropdown-btn" type="button">
                    Equipes <i class="arrow"></i>
                </button>
                <div class="dropdown-menu">
                    <a href="#teste" data-equipe="Equipe 1" data-src="Equipe01RealCopia.jpg">Equipe 1</a>
                    <a href="#teste" data-equipe="Equipe 2" data-src="Equipe01RealCopia.jpg">Equipe 2</a>
                    <a href="#teste" data-equipe="Equipe 3" data-src="Equipe01RealCopia.jpg">Equipe 3</a>
                    <a href="#teste" data-equipe="Equipe 4" data-src="Equipe01RealCopia.jpg">Equipe 4</a>
                    <a href="#teste" data-equipe="Equipe 5" data-src="Equipe01RealCopia.jpg">Equipe 5</a>
                    <a href="#teste" data-equipe="Equipe 6" data-src="Equipe01RealCopia.jpg">Equipe 6</a>
                    <a href="#teste" data-equipe="Equipe 7" data-src="Equipe01RealCopia.jpg">Equipe 7</a>
                    <a href="#teste" data-equipe="Equipe 8" data-src="Equipe01RealCopia.jpg">Equipe 8</a>
                    <a href="#teste" data-equipe="Equipe 9" data-src="Equipe01RealCopia.jpg">Equipe 9</a>
                    <a href="#teste" data-equipe="Equipe 10" data-src="Equipe01RealCopia.jpg">Equipe 10</a>
                    <a href="#teste" data-equipe="Equipe 11" data-src="Equipe01RealCopia.jpg">Equipe 11</a>
                </div>
            </div>

            <!-- DROPDOWN DA DIREITA -->
            <div class="dropdown1" id="meuDropdown2">
                <button class="dropdown-btn1" type="button">
                    Equipes <i class="arrow1"></i>
                </button>
                <div class="dropdown-menu1">
                    <a href="#teste" data-equipe="Equipe 12" data-src="Equipe02.jpeg">Equipe 12</a>
                    <a href="#teste" data-equipe="Equipe 13" data-src="Equipe02.jpeg">Equipe 13</a>
                    <a href="#teste" data-equipe="Equipe 14" data-src="Equipe02.jpeg">Equipe 14</a>
                    <a href="#teste" data-equipe="Equipe 15" data-src="Equipe02.jpeg">Equipe 15</a>
                    <a href="#teste" data-equipe="Equipe 16" data-src="Equipe02.jpeg">Equipe 16</a>
                    <a href="#teste" data-equipe="Equipe 17" data-src="Equipe02.jpeg">Equipe 17</a>
                    <a href="#teste" data-equipe="Equipe 18" data-src="Equipe02.jpeg">Equipe 18</a>
                    <a href="#teste" data-equipe="Equipe 19" data-src="Equipe02.jpeg">Equipe 19</a>
                    <a href="#teste" data-equipe="Equipe 20" data-src="Equipe02.jpeg">Equipe 20</a>
                    <a href="#teste" data-equipe="Equipe 21" data-src="Equipe02.jpeg">Equipe 21</a>
                    <a href="#teste" data-equipe="Equipe 22" data-src="Equipe02.jpeg">Equipe 22</a>
                </div>
            </div>
        </div>

        <!-- MAPA DOS ESTACIONAMENTOS -->
        <div class="container-fundo">
            <img src="Mapa B Country Real.jpeg" alt="Mapa do estacionamento do shopping Bourbon Country">
            <button class="botao-sobreposto botao-1" type="button" aria-label="Abrir equipes"></button>
        </div>

        <!-- ESTRUTURA DA JANELA MODAL -->
        <div class="modal-backdrop" id="minhaModal">
            <div class="modal-container">
                <button class="modal-fechar" id="fecharModalBtn" type="button">&times;</button>
                <img src="Equipe01RealCopia.jpg" alt="Informações da equipe" class="imagem-modal" id="imagem-modal">
            </div>
        </div>

        <script>
            const dropdown1 = document.getElementById('meuDropdown1');
            const dropdown2 = document.getElementById('meuDropdown2');

            const buttonOriginal1 = dropdown1.querySelector('.dropdown-btn');
            const buttonOriginal2 = dropdown2.querySelector('.dropdown-btn1');
            const buttonSobreposto = document.querySelector('.botao-sobreposto.botao-1');

            const linksEquipes1 = dropdown1.querySelectorAll('.dropdown-menu a');
            const linksEquipes2 = dropdown2.querySelectorAll('.dropdown-menu1 a');

            const toggleAmbosDropdowns = (e) => {
                e.stopPropagation();
                const estaAtivo = dropdown1.classList.contains('active');

                dropdown1.classList.toggle('active', !estaAtivo);
                dropdown2.classList.toggle('active', !estaAtivo);
            };

            if (buttonOriginal1) buttonOriginal1.addEventListener('click', toggleAmbosDropdowns);
            if (buttonOriginal2) buttonOriginal2.addEventListener('click', toggleAmbosDropdowns);
            if (buttonSobreposto) buttonSobreposto.addEventListener('click', toggleAmbosDropdowns);

            document.addEventListener('click', (e) => {
                const clicouFora1 = !dropdown1.contains(e.target);
                const clicouFora2 = !dropdown2.contains(e.target);
                const clicouBotaoSobreposto = buttonSobreposto && buttonSobreposto.contains(e.target);

                if (clicouFora1 && clicouFora2 && !clicouBotaoSobreposto) {
                    dropdown1.classList.remove('active');
                    dropdown2.classList.remove('active');
                }
            });

            // Elementos da Modal
            const modal = document.getElementById('minhaModal');
            const imagemModal = document.getElementById('imagem-modal');
            const fecharModalBtn = document.getElementById('fecharModalBtn');

            const configurarLinksModal = (links) => {
                links.forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const nomeEquipe = link.getAttribute('data-equipe') || 'Equipe';
                        const imagemSrc = link.getAttribute('data-src') || 'Equipe01RealCopia.jpg';

                        imagemModal.src = imagemSrc;
                        imagemModal.alt = `Informações da ${nomeEquipe}`;
                        modal.classList.add('mostrar-modal');

                        dropdown1.classList.remove('active');
                        dropdown2.classList.remove('active');
                    });
                });
            };

            configurarLinksModal(linksEquipes1);
            configurarLinksModal(linksEquipes2);

            const fecharModal = () => {
                modal.classList.remove('mostrar-modal');
            };

            fecharModalBtn.addEventListener('click', fecharModal);

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    fecharModal();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.classList.contains('mostrar-modal')) {
                    fecharModal();
                }
            });
        </script>
    </body>
</html>
