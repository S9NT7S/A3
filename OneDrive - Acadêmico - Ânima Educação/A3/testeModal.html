<!-- 
    Modal para abrir os botões
    Menu hamburguer
    Botão para abrir o botão hamburguer
    
-->
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Teste</title>
        <style>
            .container-fundo {
                position: relative;
                width: 100%;
                max-width: 2048px;
                margin: 0 auto;
            }

            .container-fundo img {
                width: 100%;
                height: auto;
                display: block;
            }

            .botao-sobreposto {
                position: absolute;
                padding: 10px 10px;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                color: black;
            }

            .botao-1 {
                top: 150px;
                left: 24%;
                background-color: red;
                width: 250px;
                height: 150px;
            }

            .dropdown {
                position: relative;
                display: inline-block;
                font-family: Arial, Helvetica, sans-serif;
            }

            .dropdown-btn {
                background-color: slateblue;
                color: white;
                padding: 12px 20px;
                font-size: 16px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: 0.2s;
            }

            .dropdown-btn:hover{
                background-color: teal;
            }

            .arrow {
                border: solid white;
                border-width: 0 2px 2px 0;
                display: inline-block;
                padding: 3px;
                transform: rotate(45deg);
                transition: transform 0.2s;
            }

            .dropdown.active .arrow {
                transform: rotate(-135deg);
                margin-top: 4px;
            }

            .dropdown-menu {
                display: none;
                position: absolute;
                background-color: white;
                min-width: 160px;
                box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.15);
                border-radius: 4px;
                margin-top: 4px;
                z-index: 1;
                overflow: hidden;
            }

            .dropdown-menu a {
                color: #333;
                padding: 12px 16px;
                text-decoration: none;
                display: block;
                transition: 0.2s;
            }

            .dropdown-menu a:hover {
                background-color: #f1f1f1;
            }

            .dropdown.active .dropdown-menu {
                display: block;
            }

            /* ==================== ESTILOS DA MODAL ==================== */
            .modal-backdrop {
                display: none; /* Escondida por padrão */
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgba(0, 0, 0, 0.5); /* Fundo escurecido */
                z-index: 10; /* Fica acima de tudo */
                justify-content: center;
                align-items: center;
            }

            .modal-container {
                background-color: white;
                padding: 24px;
                border-radius: 8px;
                width: 90%;
                max-width: 500px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.25);
                position: relative;
                font-family: Arial, sans-serif;
            }

            .modal-fechar {
                position: absolute;
                top: 12px;
                right: 16px;
                font-size: 24px;
                background: none;
                border: none;
                cursor: pointer;
                color: #666;
            }

            .modal-fechar:hover {
                color: #000;
            }

            /* Exibe a modal quando esta classe for aplicada */
            .modal-backdrop.mostrar-modal {
                display: flex;
            }
        </style>
    </head>
    <body>
        
        <div class="dropdown" id="meuDropdown">
            <button class="dropdown-btn">
                Equipes <i class="arrow"></i>
            </button>
            <div class="dropdown-menu">
                <!-- Adicionado data-equipe para identificar o conteúdo facilmente no JS -->
                <a href="#teste" data-equipe="Equipe 1">Equipe 1</a>
                <a href="#teste" data-equipe="Equipe 2">Equipe 2</a>
                <a href="#teste" data-equipe="Equipe 3">Equipe 3</a>
                <a href="#teste" data-equipe="Equipe 4">Equipe 4</a>
                <a href="#teste" data-equipe="Equipe 5">Equipe 5</a>
                <a href="#teste" data-equipe="Equipe 6">Equipe 6</a>
                <a href="#teste" data-equipe="Equipe 7">Equipe 7</a>
                <a href="#teste" data-equipe="Equipe 8">Equipe 8</a>
                <a href="#teste" data-equipe="Equipe 9">Equipe 9</a>
                <a href="#teste" data-equipe="Equipe 10">Equipe 10</a>
                <a href="#teste" data-equipe="Equipe 11">Equipe 11</a>
                <a href="#teste" data-equipe="Equipe 12">Equipe 12</a>
                <a href="#teste" data-equipe="Equipe 13">Equipe 13</a>
            </div>
        </div>

        <div class="container-fundo">
            <img src="Mapa B Country.jpeg" alt="Mapa do estacionamento do shopping Bourbon Country">
            <button class="botao-sobreposto botao-1">Equipes</button>
        </div>

        <!-- ESTRUTURA DA JANELA MODAL -->
        <div class="modal-backdrop" id="minhaModal">
            <div class="modal-container">
                <button class="modal-fechar" id="fecharModalBtn">&times;</button>
                <h2 id="modalTitulo">Título da Equipe</h2>
                <p>Aqui você pode colocar as informações detalhadas desta equipe, vagas do estacionamento ou qualquer outra especificação.</p>
            </div>
        </div>

        <script>
            // Elementos do Dropdown
            const dropdown = document.getElementById('meuDropdown');
            const buttonOriginal = dropdown.querySelector('.dropdown-btn');
            const buttonSobreposto = document.querySelector('.botao-sobreposto.botao-1');
            const linksEquipes = dropdown.querySelectorAll('.dropdown-menu a');

            // Elementos da Modal
            const modal = document.getElementById('minhaModal');
            const modalTitulo = document.getElementById('modalTitulo');
            const fecharModalBtn = document.getElementById('fecharModalBtn');
    
            // Alterna o menu dropdown ao clicar nos botões
            const toggleDropdown = (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('active');
            };
                
            if (buttonOriginal) buttonOriginal.addEventListener('click', toggleDropdown);
            if (buttonSobreposto) buttonSobreposto.addEventListener('click', toggleDropdown);

            // Fecha o dropdown se o usuário clicar fora dele
            document.addEventListener('click', (e) => {
                if (!dropdown.contains(e.target) && !buttonSobreposto.contains(e.target)) {
                    dropdown.classList.remove('active');
                }
            });

            // Lógica para abrir a Modal ao clicar em um link do Dropdown
            linksEquipes.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault(); // Impede o link de navegar/pular a página
                    
                    // Pega o nome da equipe guardado no atributo 'data-equipe'
                    const nomeEquipe = link.getAttribute('data-equipe');
                    
                    // Atualiza o título da modal com o nome correto
                    modalTitulo.textContent = nomeEquipe;
                    
                    // Exibe a modal adicionando a classe CSS
                    modal.classList.add('mostrar-modal');
                    
                    // Fecha o dropdown de equipes automaticamente
                    dropdown.classList.remove('active');
                });
            });

            // Lógica para fechar a Modal
            const fecharModal = () => {
                modal.classList.remove('mostrar-modal');
            };

            // Fecha ao clicar no botão 'X'
            fecharModalBtn.addEventListener('click', fecharModal);

            // Fecha se o usuário clicar no fundo escurecido da tela
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    fecharModal();
                }
            });
        </script>
    </body>
</html>
