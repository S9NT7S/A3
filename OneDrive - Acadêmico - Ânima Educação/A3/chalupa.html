<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Teste</title>
        <style>
            .container-fundo {
                position: relative;
                width: 100%;
                max-width: 2048px;
                margin: 0 auto;
            }

            .container-fundo img {
                width: 100%;
                height: auto;
                display: block;
            }

            .botao-sobreposto {
                position: absolute;
                padding: 10px 10px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                color: black;
            }

            .botao-1 {
                top: 400px;
                left: 20%;
                background-color: transparent;
                /* opacity: 0.3; */
                width: 290px;
                height: 125px;
            }

            /* DROPDOWN DA ESQUERDA */
            .dropdown {
                position: relative;
                display: inline-block;
                font-family: Arial, Helvetica, sans-serif;
                left: 1%;
            }

            .dropdown-btn {
                background-color: slateblue;
                color: white;
                padding: 12px 20px;
                font-size: 16px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: 0.2s;
            }

            .dropdown-btn:hover {
                background-color: orange;
            }

            .arrow {
                border: solid white;
                border-width: 0 2px 2px 0;
                display: inline-block;
                padding: 3px;
                transform: rotate(45deg);
                transition: transform 0.2s;
            }

            .dropdown.active .arrow {
                transform: rotate(-135deg);
                margin-top: 4px;
            }

            .dropdown-menu {
                display: none;
                position: absolute;
                background-color: white;
                min-width: 160px;
                box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.15);
                border-radius: 4px;
                margin-top: 4px;
                z-index: 1;
                overflow: hidden;
            }

            .dropdown-menu a {
                color: #333;
                padding: 30px 30px;
                text-decoration: none;
                display: block;
                transition: 0.2s;
            }

            .dropdown-menu a:hover {
                background-color: #f1f1f1;
            }

            .dropdown.active .dropdown-menu {
                display: block;
            }

            /* DROPDOWN DA DIREITA */
            .dropdown1 {
                position: relative;
                display: inline-block;
                font-family: Arial, Helvetica, sans-serif;
                left: 84%;
            }

            .dropdown-btn1 {
                background-color: slateblue;
                color: white;
                padding: 12px 20px;
                font-size: 16px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                transition: 0.2s;
            }

            .dropdown-btn1:hover {
                background-color: orange;
            }

            .arrow1 {
                border: solid white;
                border-width: 0 2px 2px 0;
                display: inline-block;
                padding: 3px;
                transform: rotate(45deg);
                transition: transform 0.2s;
            }

            .dropdown1.active .arrow1 {
                transform: rotate(-135deg);
                margin-top: 4px;
            }

            .dropdown-menu1 {
                display: none;
                position: absolute;
                background-color: white;
                min-width: 160px;
                box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.15);
                border-radius: 4px;
                margin-top: 4px;
                z-index: 1;
                overflow: hidden;
            }

            .dropdown-menu1 a {
                color: #333;
                padding: 30px 30px;
                text-decoration: none;
                display: block;
                transition: 0.2s;
            }

            .dropdown-menu1 a:hover {
                background-color: #f1f1f1;
            }

            .dropdown1.active .dropdown-menu1 {
                display: block;
            }

            /* ==================== ESTILOS DA MODAL ==================== */
            .modal-backdrop {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 10;
                justify-content: center;
                align-items: center;
            }

            .modal-container {
                background-color: white;
                /* padding: 24px; */
                border-radius: 8px;
                width: 90%;
                max-width: 1200px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.25);
                position: relative;
                font-family: Arial, sans-serif;
            }

            .modal-fechar {
                position: absolute;
                top: 3%;
                right: 5%;
                font-size: 100px;
                background: none;
                border: none;
                cursor: pointer;
                color: #ff0000;
            }

            .modal-fechar:hover {
                color: #000;
            }

            .modal-backdrop.mostrar-modal {
                display: flex;
            }

            /* IMAGEM DENTRO DO MODAL */
            .imagem-modal {
                width: 100%;         /* Largura fixa */
                height: 100%;        /* Altura fixa */
                object-fit: fill;     /*Mantém a proporção e corta o excesso para caber no quadrado */
                /* border-radius: 50%;    Opcional: deixa a imagem redonda */
                display: block;
                margin: 0 auto 16px auto; /* Centraliza a imagem horizontalmente */
            }
        </style>
    </head>
    <body>
        
        <!-- DROPDOWN DA ESQUERDA -->
        <div class="dropdown" id="meuDropdown1">
            <button class="dropdown-btn">
                Equipes <i class="arrow"></i>
            </button>
            <div class="dropdown-menu">
                <a href="#teste" data-equipe="Equipe 1">Equipe 1</a>
                <a href="#teste" data-equipe="Equipe 2">Equipe 2</a>
                <a href="#teste" data-equipe="Equipe 3">Equipe 3</a>
                <a href="#teste" data-equipe="Equipe 4">Equipe 4</a>
                <a href="#teste" data-equipe="Equipe 5">Equipe 5</a>
                <a href="#teste" data-equipe="Equipe 6">Equipe 6</a>
                <a href="#teste" data-equipe="Equipe 7">Equipe 7</a>
                <a href="#teste" data-equipe="Equipe 8">Equipe 8</a>
                <a href="#teste" data-equipe="Equipe 9">Equipe 9</a>
                <a href="#teste" data-equipe="Equipe 10">Equipe 10</a>
                <a href="#teste" data-equipe="Equipe 11">Equipe 11</a>
            </div>
        </div>

        <!-- DROPDOWN DA DIREITA -->
        <div class="dropdown1" id="meuDropdown2">
            <button class="dropdown-btn1">
                Equipes <i class="arrow1"></i>
            </button>
            <div class="dropdown-menu1">
                <a href="#teste" data-equipe="Equipe 12">Equipe 12</a>
                <a href="#teste" data-equipe="Equipe 13">Equipe 13</a>
                <a href="#teste" data-equipe="Equipe 14">Equipe 14</a>
                <a href="#teste" data-equipe="Equipe 15">Equipe 15</a>
                <a href="#teste" data-equipe="Equipe 16">Equipe 16</a>
                <a href="#teste" data-equipe="Equipe 17">Equipe 17</a>
                <a href="#teste" data-equipe="Equipe 18">Equipe 18</a>
                <a href="#teste" data-equipe="Equipe 19">Equipe 19</a>
                <a href="#teste" data-equipe="Equipe 20">Equipe 20</a>
                <a href="#teste" data-equipe="Equipe 21">Equipe 21</a>
                <a href="#teste" data-equipe="Equipe 22">Equipe 22</a>
            </div>
        </div>

        <!-- MAPA DOS ESTACIONAMENTOS -->
        <div class="container-fundo">
            <img src="Mapa B Country Real.jpeg" alt="Mapa do estacionamento do shopping Bourbon Country">
            <button class="botao-sobreposto botao-1"></button>
        </div>

        <!-- ESTRUTURA DA JANELA MODAL -->
        <div class="modal-backdrop" id="minhaModal">
            <div class="modal-container">
                <button class="modal-fechar" id="fecharModalBtn">&times;</button>
                <!-- <h2 id="modalTitulo"></h2> -->
                <img src="Equipe01RealCopia.jpg" alt="Info da equipe 01" class="imagem-modal" id="imagem-modal">
                <!-- <p>Aqui você pode colocar as informações detalhadas desta equipe, vagas do estacionamento ou qualquer outra especificação.</p> -->
            </div>
        </div>

        <script>
            // Elementos dos Dropdowns
            const dropdown1 = document.getElementById('meuDropdown1');
            const dropdown2 = document.getElementById('meuDropdown2');
            
            const buttonOriginal1 = dropdown1.querySelector('.dropdown-btn');
            const buttonOriginal2 = dropdown2.querySelector('.dropdown-btn1');
            const buttonSobreposto = document.querySelector('.botao-sobreposto.botao-1');
            
            const linksEquipes1 = dropdown1.querySelectorAll('.dropdown-menu a');
            const linksEquipes2 = dropdown2.querySelectorAll('.dropdown-menu1 a');

            // Função para alternar AMBOS os dropdowns simultaneamente
            const toggleAmbosDropdowns = (e) => {
                e.stopPropagation();
                
                // Verifica se já estão ativos baseando-se no primeiro dropdown
                const estaAtivo = dropdown1.classList.contains('active');
                
                if (estaAtivo) {
                    dropdown1.classList.remove('active');
                    dropdown2.classList.remove('active');
                } else {
                    dropdown1.classList.add('active');
                    dropdown2.classList.add('active');
                }
            };

            // Atrela a abertura em conjunto a todos os botões que acionam os menus
            if (buttonOriginal1) buttonOriginal1.addEventListener('click', toggleAmbosDropdowns);
            if (buttonOriginal2) buttonOriginal2.addEventListener('click', toggleAmbosDropdowns);
            if (buttonSobreposto) buttonSobreposto.addEventListener('click', toggleAmbosDropdowns);

            // Fecha ambos se o usuário clicar fora de qualquer um deles
            document.addEventListener('click', (e) => {
                const clicouFora1 = !dropdown1.contains(e.target);
                const clicouFora2 = !dropdown2.contains(e.target);
                const clicouBotaoSobreposto = buttonSobreposto && buttonSobreposto.contains(e.target);

                if (clicouFora1 && clicouFora2 && !clicouBotaoSobreposto) {
                    dropdown1.classList.remove('active');
                    dropdown2.classList.remove('active');
                }
            });

            // Elementos da Modal
            const modal = document.getElementById('minhaModal');
            const modalTitulo = document.getElementById('imagem-modal');
            const fecharModalBtn = document.getElementById('fecharModalBtn');

            // Configura os links para abrir a modal e fechar os menus
            const configurarLinksModal = (links) => {
                links.forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const nomeEquipe = link.getAttribute('data-equipe');
                        modalTitulo.textContent = nomeEquipe;
                        modal.classList.add('mostrar-modal');
                        
                        // Fecha ambos os dropdowns ao selecionar uma equipe
                        dropdown1.classList.remove('active');
                        dropdown2.classList.remove('active');
                    });
                });
            };

            configurarLinksModal(linksEquipes1);
            configurarLinksModal(linksEquipes2);

            // Lógica para fechar a Modal
            const fecharModal = () => {
                modal.classList.remove('mostrar-modal');
            };

            fecharModalBtn.addEventListener('click', fecharModal);

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    fecharModal();
                }
            });
        </script>
    </body>
</html>
